# Cuts a GitHub Release whenever the version in extension/manifest.json changes
# on main: a zip for Load-unpacked, and a signed .crx that Chrome installs and
# updates by itself through the app's /ext/updates.xml. Bump, push, done.
name: Release extension
on:
  push:
    branches: [main]
    paths: ['extension/**', 'RELEASE.md']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: v
        run: echo "ver=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - id: t
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.v.outputs.ver }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.t.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRX_KEY: ${{ secrets.CRX_KEY }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -e
          (cd extension && zip -qr "../quicksell-extension-$VER.zip" . -x '.DS_Store')
          printf '%s' "$CRX_KEY" > crx.pem
          npx --yes crx3 extension -p crx.pem -o "quicksell-$VER.crx"
          rm -f crx.pem
          head -c 4 "quicksell-$VER.crx" | grep -q 'Cr24'
          gh release create "v$VER" "quicksell-extension-$VER.zip" "quicksell-$VER.crx" \
            --title "Quicksell $VER" --notes-file RELEASE.md

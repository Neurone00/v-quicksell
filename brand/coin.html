<title>Quicksell Coin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,60&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --calypso:#007782; --page:#EDF2F2; --surface:#fff; --ink:#15191A; --muted:#5A6566; --line:rgba(21,25,26,.12); --dark:#0E1212; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --calypso:#2FC4CE; --page:#0E1212; --surface:#171D1E; --ink:#F2F5F5; --muted:#9BA7A8; --line:rgba(242,245,245,.14); } }
  :root[data-theme="dark"] { --calypso:#2FC4CE; --page:#0E1212; --surface:#171D1E; --ink:#F2F5F5; --muted:#9BA7A8; --line:rgba(242,245,245,.14); }
  *{box-sizing:border-box} body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding-block:24px 48px;padding-left:20px;padding-right:20px}
  h1{margin:0;font:600 25px/1 Fraunces,Georgia,serif;font-variation-settings:'SOFT' 60;letter-spacing:-.01em;color:var(--calypso)}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 24px}
  h2{font:600 11px/1 Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ground{border-radius:16px;display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:100%;color:var(--calypso)}
  .light{background:var(--surface);border:1px solid var(--line)} .dk{background:var(--dark);color:#2FC4CE}
  .sizes{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;color:var(--calypso)}
  .sz{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:12px} .sz svg{color:var(--calypso)}
  .lock{display:flex;align-items:center;gap:10px;margin-left:auto} .lock b{font:600 25px/1 Fraunces,Georgia,serif;font-variation-settings:'SOFT' 60;letter-spacing:-.01em;color:var(--calypso)}

</style>

<title>Quicksell Coin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,60&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --calypso:#007782; --page:#EDF2F2; --surface:#fff; --ink:#15191A; --muted:#5A6566; --line:rgba(21,25,26,.12); --dark:#0E1212; --darksurf:#171D1E; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --calypso:#2FC4CE; --page:#0E1212; --surface:#171D1E; --ink:#F2F5F5; --muted:#9BA7A8; --line:rgba(242,245,245,.14); } }
  :root[data-theme="dark"] { --calypso:#2FC4CE; --page:#0E1212; --surface:#171D1E; --ink:#F2F5F5; --muted:#9BA7A8; --line:rgba(242,245,245,.14); }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding-block:24px 48px;padding-left:20px;padding-right:20px}
  h1{margin:0;font:600 25px/1 Fraunces,Georgia,serif;font-variation-settings:'SOFT' 60;letter-spacing:-.01em;color:var(--calypso)}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 24px}
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ground{border-radius:16px;display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-width:100%}
  .light{background:var(--surface);border:1px solid var(--line)}
  .dk{background:var(--dark)}
  .ground svg{width:78%;height:78%}
  h2{font:600 11px/1 Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
  .sizes{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
  .sz{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .lock{display:flex;align-items:center;gap:10px;margin-left:auto}
  .lock svg{width:44px;height:44px}
  .lock b{font:600 25px/1 Fraunces,Georgia,serif;font-variation-settings:'SOFT' 60;letter-spacing:-.01em;color:var(--calypso)}
  @media (max-width:560px){.hero{grid-template-columns:1fr}}
</style>
<div class="wrap">
  <h1>Quicksell Coin</h1>
  <p class="sub">Un logo 2D che legge in 3D: il marchio battuto su una moneta Calypso, inclinata verso chi guarda. La Q resta dritta.</p>

  <div class="hero">
    <div class="ground light"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" style="width:78%;height:78%">
  <!-- Quicksell coin: the Q-hanger mark struck on a Calypso coin, tilted back
       toward the viewer. 2D, reads as 3D. The Q stays upright (the mark is
       never rotated); the depth comes from the perspective squash, the visible
       thickness, the satin gradient and the emboss. Shades are tints/shades of
       Calypso only — no new hues. -->
  <defs>
    <linearGradient id="qs-face" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0"   stop-color="#2A9DA7"/>
      <stop offset="0.5" stop-color="#007782"/>
      <stop offset="1"   stop-color="#005F69"/>
    </linearGradient>
    <linearGradient id="qs-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#005F69"/>
      <stop offset="1" stop-color="#003A42"/>
    </linearGradient>
    <radialGradient id="qs-spec" cx="0.32" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- thickness (the coin's edge, seen because it tilts back) -->
  <ellipse cx="128" cy="146" rx="106" ry="82" fill="url(#qs-edge)"/>
  <!-- a thin light lip where the edge meets the face -->
  <ellipse cx="128" cy="130" rx="106" ry="82" fill="#2A9DA7" opacity="0.9"/>
  <!-- face -->
  <ellipse cx="128" cy="128" rx="106" ry="82" fill="url(#qs-face)"/>
  <!-- struck rim ring: light on the upper edge, shadow on the lower -->
  <ellipse cx="128" cy="128" rx="95" ry="73" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2.4"/>
  <ellipse cx="129.5" cy="130" rx="95" ry="73" fill="none" stroke="#003A42" stroke-opacity="0.35" stroke-width="1.6"/>
  <!-- specular sheen -->
  <ellipse cx="128" cy="128" rx="106" ry="82" fill="url(#qs-spec)"/>

  <!-- the mark, upright, squashed into the face's perspective -->
  <g transform="translate(128 128) scale(1 0.78) translate(-89.25 -87.3) scale(2.55)"
     fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- emboss: dark cast below-right, then the white relief -->
    <g stroke="#003A42" stroke-opacity="0.6" transform="translate(1.1 1.5)">
      <circle cx="29" cy="31" r="16.5"/>
      <path d="M40.5 43 L47.5 50 C 51.5 54, 57.5 52.5, 57.5 47.5 C 57.5 44, 54.5 42.5, 52.5 44"/>
    </g>
    <g stroke="#ffffff">
      <circle cx="29" cy="31" r="16.5"/>
      <path d="M40.5 43 L47.5 50 C 51.5 54, 57.5 52.5, 57.5 47.5 C 57.5 44, 54.5 42.5, 52.5 44"/>
    </g>
  </g>
</svg></div>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" color="#007782">
  <!-- Quicksell coin, drawn / etched: one line weight, no fills. The Q-hanger
       mark struck upright on a coin tilted back toward the viewer; the edge is
       reeded with short strokes, the shadow is hatched. currentColor = Calypso. -->
  <defs><clipPath id="qs-inner"><ellipse cx="128" cy="116" rx="87" ry="63"/></clipPath></defs>
  <!-- edge: the lower arc, and the two short sides -->
  <path d="M28 116 v22 A100 74 0 0 0 228 138 v-22" stroke-width="9"/>
  <g stroke-width="3" opacity=".85"><line x1="38" y1="148.3" x2="38" y2="170.3"/><line x1="48" y1="160.4" x2="48" y2="182.4"/><line x1="58" y1="168.8" x2="58" y2="190.8"/><line x1="68" y1="175.2" x2="68" y2="197.2"/><line x1="78" y1="180.1" x2="78" y2="202.1"/><line x1="88" y1="183.8" x2="88" y2="205.8"/><line x1="98" y1="186.6" x2="98" y2="208.6"/><line x1="108" y1="188.5" x2="108" y2="210.5"/><line x1="118" y1="189.6" x2="118" y2="211.6"/><line x1="128" y1="190.0" x2="128" y2="212.0"/><line x1="138" y1="189.6" x2="138" y2="211.6"/><line x1="148" y1="188.5" x2="148" y2="210.5"/><line x1="158" y1="186.6" x2="158" y2="208.6"/><line x1="168" y1="183.8" x2="168" y2="205.8"/><line x1="178" y1="180.1" x2="178" y2="202.1"/><line x1="188" y1="175.2" x2="188" y2="197.2"/><line x1="198" y1="168.8" x2="198" y2="190.8"/><line x1="208" y1="160.4" x2="208" y2="182.4"/><line x1="218" y1="148.3" x2="218" y2="170.3"/></g>
  <!-- face and struck ring -->
  <ellipse cx="128" cy="116" rx="100" ry="74" stroke-width="9"/>
  <ellipse cx="128" cy="116" rx="87" ry="63" stroke-width="4"/>
  <!-- etched shadow on the face, lower right -->
  <g clip-path="url(#qs-inner)" stroke-width="2.4" opacity=".55"><line x1="170" y1="196" x2="232" y2="134"/><line x1="181" y1="196" x2="243" y2="134"/><line x1="192" y1="196" x2="254" y2="134"/><line x1="203" y1="196" x2="265" y2="134"/></g>
  <!-- the mark, upright, in the face's perspective -->
  <g transform="translate(128 116) scale(1 .76) translate(-80.5 -78.8) scale(2.3)" stroke-width="6.5"><circle cx="29" cy="31" r="16.5"/><path d="M40.5 43 L47.5 50 C 51.5 54, 57.5 52.5, 57.5 47.5 C 57.5 44, 54.5 42.5, 52.5 44"/></g>
</svg>

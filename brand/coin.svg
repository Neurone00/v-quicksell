<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Quicksell coin: the Q-hanger mark struck on a Calypso coin, tilted back
       toward the viewer. 2D, reads as 3D. The Q stays upright (the mark is
       never rotated); the depth comes from the perspective squash, the visible
       thickness, the satin gradient and the emboss. Shades are tints/shades of
       Calypso only — no new hues. -->
  <defs>
    <linearGradient id="qs-face" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0"   stop-color="#2A9DA7"/>
      <stop offset="0.5" stop-color="#007782"/>
      <stop offset="1"   stop-color="#005F69"/>
    </linearGradient>
    <linearGradient id="qs-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#005F69"/>
      <stop offset="1" stop-color="#003A42"/>
    </linearGradient>
    <radialGradient id="qs-spec" cx="0.32" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- thickness (the coin's edge, seen because it tilts back) -->
  <ellipse cx="128" cy="146" rx="106" ry="82" fill="url(#qs-edge)"/>
  <!-- a thin light lip where the edge meets the face -->
  <ellipse cx="128" cy="130" rx="106" ry="82" fill="#2A9DA7" opacity="0.9"/>
  <!-- face -->
  <ellipse cx="128" cy="128" rx="106" ry="82" fill="url(#qs-face)"/>
  <!-- struck rim ring: light on the upper edge, shadow on the lower -->
  <ellipse cx="128" cy="128" rx="95" ry="73" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2.4"/>
  <ellipse cx="129.5" cy="130" rx="95" ry="73" fill="none" stroke="#003A42" stroke-opacity="0.35" stroke-width="1.6"/>
  <!-- specular sheen -->
  <ellipse cx="128" cy="128" rx="106" ry="82" fill="url(#qs-spec)"/>

  <!-- the mark, upright, squashed into the face's perspective -->
  <g transform="translate(128 128) scale(1 0.78) translate(-89.25 -87.3) scale(2.55)"
     fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- emboss: dark cast below-right, then the white relief -->
    <g stroke="#003A42" stroke-opacity="0.6" transform="translate(1.1 1.5)">
      <circle cx="29" cy="31" r="16.5"/>
      <path d="M40.5 43 L47.5 50 C 51.5 54, 57.5 52.5, 57.5 47.5 C 57.5 44, 54.5 42.5, 52.5 44"/>
    </g>
    <g stroke="#ffffff">
      <circle cx="29" cy="31" r="16.5"/>
      <path d="M40.5 43 L47.5 50 C 51.5 54, 57.5 52.5, 57.5 47.5 C 57.5 44, 54.5 42.5, 52.5 44"/>
    </g>
  </g>
</svg>

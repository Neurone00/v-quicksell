<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600,60&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--calypso:#007782;--mint:#32AE88;--page:#EDF2F2;--surface:#fff;--ink:#15191A;--muted:#5A6566;--line:rgba(21,25,26,.12);--warn:#B4690E;--warn-soft:#FBF0DD}
@media(prefers-color-scheme:dark){:root{--calypso:#2FC4CE;--mint:#4FD6A8;--page:#0E1212;--surface:#171D1E;--ink:#F2F5F5;--muted:#9BA7A8;--line:rgba(242,245,245,.14);--warn:#E8A33D;--warn-soft:#2A2213}}
body{width:330px;margin:0;padding:14px;font:14px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--page)}
h1{display:flex;align-items:center;gap:8px;font:600 20px/1 Fraunces,Georgia,serif;font-variation-settings:'SOFT' 60;color:var(--calypso);margin:0 0 12px;letter-spacing:-.01em}
h1 svg{width:24px;height:24px;flex:none}
h2{font:600 11px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
label{display:block;font:600 11px/1 Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 5px}
input{width:100%;box-sizing:border-box;padding:9px 11px;border:1.5px solid transparent;background:var(--surface);color:var(--ink);border-radius:12px;font:inherit}
input:focus{outline:0;border-color:var(--calypso)}
button{background:var(--calypso);color:#fff;border:0;border-radius:99px;padding:10px 14px;font:600 13px Inter,system-ui;cursor:pointer;margin-top:8px}
@media(prefers-color-scheme:dark){button{color:#04211f}}
.card{background:var(--surface);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}
.card a{color:var(--calypso);font-weight:600;text-decoration:none}
.card a:hover{text-decoration:underline}
.upd{background:var(--warn-soft);color:var(--warn)}.upd a{color:var(--warn)}
small{color:var(--muted)}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;margin:8px 0}
.qr img{display:block;width:150px;height:150px;image-rendering:pixelated}
.big{width:100%;margin-top:4px}
.gear{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;padding:5px;margin:0;border-radius:10px;line-height:0}
.gear:hover{background:var(--surface);color:var(--ink)}
.gear svg{width:19px;height:19px}
.price{font-weight:600;color:var(--ink)}
.listing{display:flex;gap:10px;align-items:center}
.listing .th{width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none;background:var(--page)}
.listing .txt{min-width:0;flex:1}
.listing .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due{color:var(--warn);font-weight:600}
.back{background:none;color:var(--calypso);border:0;padding:0;margin:2px 0 6px;font:600 13px Inter;cursor:pointer}
.muted-row{color:var(--muted);font-size:12px;margin:2px 0}
</style>

<h1>
  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="29" cy="31" r="16.5"/><path d="M40.5 43 L47.5 50 C 51.5 54, 57.5 52.5, 57.5 47.5 C 57.5 44, 54.5 42.5, 52.5 44"/></svg>
  Quicksell
  <button id="gear" class="gear" title="Impostazioni" aria-label="Impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</h1>
<div id="upd"></div>

<div id="main">
  <div id="conn"></div>
  <div id="due"></div>
  <h2 id="listhead" hidden>Annunci attivi</h2>
  <div id="listings"></div>
</div>

<div id="settings" hidden>
  <button id="back" class="back">← Annunci</button>
  <h2>Account</h2>
  <div id="accStatus" class="card"><small>…</small></div>
  <div id="phone"></div>
  <details><summary style="cursor:pointer;font-size:12px;color:var(--muted);margin:6px 0">Avanzate</summary>
    <label>Indirizzo dell'app</label><input id="appUrl" placeholder="https://v-quicksell.neurone00.workers.dev">
    <label>Chiave (solo per un'altra istanza)</label><input id="secret" type="password" placeholder="vuoto = usa il login dell'app">
    <button id="save">Salva</button> <small id="st"></small>
  </details>
  <h2>Se qualcosa non si compila</h2>
  <button id="diag" style="margin-top:0">Diagnostica la pagina Vinted aperta</button>
  <div id="diagout"></div>
</div>

<script src="qrcode.js"></script>
<script src="popup.js"></script>

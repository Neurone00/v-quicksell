<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V Quicksell</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#007782">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Vinted palette, sampled from vinted.it. Calypso darkened per the 2022 Kiln
   rebrand and paired with mint — same move, same reason: legibility. */
:root{
  --calypso:#007782; --calypso-ink:#005760; --mint:#32AE88; --mint-soft:#D6EFE6;
  --ink:#15191A; --muted:#5A6566; --page:#EDF2F2; --surface:#fff;
  --line:rgba(21,25,26,.12); --warn:#B4690E; --warn-soft:#FBF0DD; --bad:#D4351C;
  --r:18px; --overshoot:cubic-bezier(.34,1.42,.64,1);
}
@media(prefers-color-scheme:dark){:root{
  --calypso:#2FC4CE; --calypso-ink:#7FE3EA; --mint:#4FD6A8; --mint-soft:#11302a;
  --ink:#F2F5F5; --muted:#9BA7A8; --page:#0E1212; --surface:#171D1E;
  --line:rgba(242,245,245,.14); --warn:#E8A33D; --warn-soft:#2A2213; --bad:#F2796B;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:400 15px/1.55 Inter,-apple-system,system-ui,sans-serif;
  padding:0 0 108px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--page);
  padding:calc(16px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:baseline;gap:10px}
h1{font:600 25px/1 Fraunces,Georgia,serif;font-variation-settings:'SOFT' 60;
  margin:0;flex:1;color:var(--calypso);letter-spacing:-.01em}
.v{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gear{padding:7px 11px;font-size:15px;line-height:1;border-radius:99px}
main{padding:0 20px;max-width:640px;margin:0 auto}

/* The Kiln "flowing line": one thread down the whole journey. */
#list{position:relative;padding-left:26px}
#list:before{content:'';position:absolute;left:5px;top:10px;bottom:10px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--calypso),var(--mint) 55%,var(--line));opacity:.5}
#list:empty:before{display:none}
.card{position:relative;background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(21,25,26,.06),0 8px 24px -14px rgba(21,25,26,.28);
  animation:rise .4s var(--overshoot) both}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
#list .card:before{content:'';position:absolute;left:-25px;top:24px;width:12px;height:12px;border-radius:50%;
  background:var(--dot,var(--muted));box-shadow:0 0 0 4px var(--page)}
.card[data-s=pending]{--dot:var(--calypso)} .card[data-s=needs_input]{--dot:var(--warn)}
.card[data-s=ready]{--dot:var(--calypso)} .card[data-s=live]{--dot:var(--mint)}
.card[data-s=sold]{--dot:var(--mint)} .card[data-s=error]{--dot:var(--bad)}
.card.due{box-shadow:inset 0 0 0 1.5px var(--warn),0 8px 24px -14px rgba(21,25,26,.28)}

.row{display:flex;gap:10px;align-items:center}
.badge{font:600 11px/1 Inter;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:99px;
  background:var(--page);color:var(--muted)}
.badge.pending,.badge.ready{background:color-mix(in srgb,var(--calypso) 13%,transparent);color:var(--calypso)}
.badge.needs_input{background:var(--warn-soft);color:var(--warn)}
.badge.live,.badge.sold{background:var(--mint-soft);color:var(--mint)}
.badge.error{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}

/* Tactile frames: the rebrand's "imperfection and a human touch". */
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:12px 4px;margin:0 -4px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none;background:var(--page);
  box-shadow:0 2px 10px -4px rgba(21,25,26,.4);transition:transform .3s var(--overshoot)}
.thumbs img:nth-child(odd){transform:rotate(-1.4deg)}
.thumbs img:nth-child(even){transform:rotate(1.1deg)}
.thumbs img:hover{transform:rotate(0) scale(1.06)}

h2{font:600 17px/1.3 Inter;margin:2px 0 4px;letter-spacing:-.01em}
p{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.note{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px}
label{display:block;font:600 10.5px/1 Inter;color:var(--muted);letter-spacing:.08em;
  text-transform:uppercase;margin:14px 0 6px}
input,textarea{width:100%;background:var(--page);color:var(--ink);border:1.5px solid transparent;
  border-radius:12px;padding:11px 13px;font:400 15px/1.4 Inter;transition:border-color .16s}
input:focus,textarea:focus{outline:0;border-color:var(--calypso);background:var(--surface)}
textarea{min-height:104px;resize:vertical}

button{background:var(--calypso);color:#fff;border:0;border-radius:99px;padding:13px 20px;
  font:600 15px/1 Inter;cursor:pointer;transition:transform .18s var(--overshoot),filter .18s}
button:hover{filter:brightness(1.08)} button:active{transform:scale(.96)}
button.sec{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
button.rm{margin:0 0 0 auto;padding:4px 8px;background:transparent;color:var(--muted);box-shadow:none;font-size:15px;line-height:1;border-radius:8px}
button.rm:hover{color:var(--ink);background:var(--line)}
button.warn{background:var(--warn);color:#fff}
button:disabled{opacity:.45;pointer-events:none}
@media(prefers-color-scheme:dark){button{color:#04211f}button.warn{color:#1a1206}}
a.btn{display:inline-block;text-decoration:none;text-align:center}

.fab{position:fixed;left:20px;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));
  max-width:600px;margin:0 auto;padding:17px;font-size:16px;z-index:30;
  box-shadow:0 10px 34px -10px color-mix(in srgb,var(--calypso) 70%,transparent)}

.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 4px}
.prices div{background:var(--page);border-radius:13px;padding:11px 6px;text-align:center}
.prices b{display:block;font:600 19px/1.2 Inter;font-variant-numeric:tabular-nums}
.prices span{font:500 9.5px/1.4 Inter;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.prices input{text-align:center;padding:0;border:0;background:transparent;
  font:600 19px/1.2 Inter;font-variant-numeric:tabular-nums;color:var(--calypso)}
.prices input:focus{background:transparent;border-color:transparent;text-decoration:underline}
.why{font-size:12.5px;color:var(--muted);background:var(--page);border-radius:13px;padding:11px 13px;margin:10px 0;
  border-left:3px solid var(--calypso)}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 12px;margin:8px 0}
.hint{font-size:12.5px;color:var(--muted);background:var(--page);border-radius:12px;padding:10px 12px;margin:8px 0}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted);margin:10px 0;list-style:none}
details summary:before{content:'▸ '} details[open] summary:before{content:'▾ '}
.sp{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--calypso);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:14px}
.empty b{display:block;font:600 19px/1.3 Fraunces,Georgia,serif;color:var(--ink);margin-bottom:6px}
.empty .illu{display:block;margin:0 auto 18px;opacity:.55}
.anim{display:inline-block;flex:none}.anim svg{width:100%;height:100%;display:block}
.empty .anim{display:block;margin:0 auto 18px}
code{font:500 12.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--page);padding:2px 6px;border-radius:6px}
.toast{position:fixed;left:20px;right:20px;top:calc(72px + env(safe-area-inset-top));max-width:600px;margin:0 auto;
  background:var(--ink);color:var(--page);border-radius:14px;padding:12px 16px;font-size:13.5px;z-index:40;
  animation:rise .4s var(--overshoot) both}

/* Continuous-line illustrations: one grid, one stroke weight; draw once, then gesture. */
.illu{color:var(--calypso);flex:none}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes swing{0%,55%,100%{transform:rotate(0)}12%{transform:rotate(11deg)}28%{transform:rotate(-8deg)}42%{transform:rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes glow{0%,100%{opacity:1}45%{opacity:.45}}
.illu path{stroke-dasharray:100;animation:draw 1.15s ease-in-out both}
.illu path:nth-child(2){animation-delay:.16s} .illu path:nth-child(3){animation-delay:.32s}
.i-bell{animation:swing 3.4s ease-in-out 1.5s infinite;transform-origin:50% 18%}
.i-hanger{animation:sway 3.6s ease-in-out 1.5s infinite;transform-origin:50% 14%}
.i-check path{animation:draw 1.15s ease-in-out both,glow 2.8s ease-in-out 1.5s infinite}
@media(prefers-reduced-motion:reduce){.illu,.illu path{animation:none!important;stroke-dasharray:none!important}}

/* Onboarding is a gate: nothing behind it is reachable until it is done. */
#setup.gate{position:fixed;inset:0;z-index:100;background:var(--page);overflow-y:auto;
  display:grid;align-content:center;gap:12px;
  padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
#setup.gate .card{max-width:560px;margin:0 auto;width:100%}
body.gated{overflow:hidden} body.gated .fab{display:none}
.onb{padding:22px}
.onb-h{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.onb-h h2{margin:0 0 2px}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;font-size:14px;color:var(--ink)}
.step b{font-weight:600;font-size:15px}
.tick{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
  font:600 12px/1 Inter;background:var(--calypso);color:#fff}
@media(prefers-color-scheme:dark){.tick{color:#04211f}}
</style>
</head>
<body>
<header><h1>Quicksell</h1><span class="v" id="ver"></span>
<button class="gear sec" id="gear" title="Impostazioni" aria-label="Impostazioni">⚙</button></header>
<main><div id="setup"></div><div id="list"></div></main>
<input type="file" id="file" accept="image/*" multiple hidden>
<button class="fab" id="add">Aggiungi le foto di un capo</button>

<script>
/* Continuous-line illustrations, one 64-grid, one stroke weight. */
const ILLU = {
  hanger: `<path pathLength="100" d="M32 15c0-3.3 2.7-6 6-6s6 2.7 6 6c0 2.6-1.7 4-4.3 5L32 23 8 36c-2.2 1.1-3.4 2.3-3.4 3.9 0 2 1.8 3.4 4.4 3.4h46c2.6 0 4.4-1.4 4.4-3.4 0-1.6-1.2-2.8-3.4-3.9L32 23"/>`,
  bell:   `<path pathLength="100" d="M32 13a12.5 12.5 0 00-12.5 12.5v7.8L15 41h34l-4.5-7.7v-7.8A12.5 12.5 0 0032 13z"/><path pathLength="100" d="M27.5 46a4.5 4.5 0 009 0"/><path pathLength="100" d="M32 8.5V13"/>`,
  check:  `<path pathLength="100" d="M14 33l12 12 24-26"/>`,
};
// A Lottie slot wraps the line illustration: the SVG shows until the animation
// loads, and stays if the player or the file is missing. Dark variant by theme.
const anim = (name, svgName, size = 64) =>
  `<span class="anim" data-anim="${name}" style="width:${size}px;height:${size}px">${illu(svgName, size)}</span>`;
const lottieCache = {};
async function mountAnims() {
  if (!window.lottie) return;
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (const el of document.querySelectorAll('.anim[data-anim]:not([data-live])')) {
    const file = `/lottie/${el.dataset.anim}${dark ? '-dark' : ''}.json`;
    try {
      lottieCache[file] ??= await fetch(file).then((r) => (r.ok ? r.json() : null));
      if (!lottieCache[file]) continue;
      el.dataset.live = '1'; el.innerHTML = '';
      const a = lottie.loadAnimation({ container: el, renderer: 'svg', loop: true, autoplay: !still, animationData: lottieCache[file] });
      if (still) a.goToAndStop(a.totalFrames / 2, true);
    } catch {}
  }
}
const illu = (name, size = 64) =>
  `<svg class="illu i-${name}" viewBox="0 0 64 64" width="${size}" height="${size}" fill="none"
    stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${ILLU[name]}</svg>`;

const $ = (s) => document.querySelector(s);
const api = (p, o) => fetch('/api' + p, o).then((r) => r.json());
const eur = (n) => (n == null ? '—' : '€' + Number(n).toFixed(2).replace('.00', ''));
const esc = (s) => (s || '').replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
let items = [], CFG = {}, showSetup = false, uploading = 0, draining = false;

const LABEL = { queued:'In coda', analyzing:'Analisi', needs_input:'Serve conferma', pending:'Da approvare',
  ready:'Pronto da pubblicare', live:'Online', sold:'Venduto', error:'Errore' };

async function refresh() {
  const [st, d] = await Promise.all([api('/status'), api('/items')]);
  if (st.error === 'unauthorized') return locked();
  CFG = st; $('#ver').textContent = 'v' + st.version;
  renderSetup(st); apkBanner(st);
  items = d.items || [];
  render(!!document.querySelector('.onb'));
  mountAnims();
}

function emailCard(st) {
  const has = st.email;
  return `<div class="card">
    <h2>Email di recupero</h2>
    <p style="margin:6px 0 10px">${has ? `Collegata: <b>${esc(st.email)}</b>. Se perdi la chiave, la recuperi da qui con un link.` : 'Collega un\'email: se perdi la chiave, te la rimandiamo con un link. Niente password.'}</p>
    <input id="bindmail" type="email" placeholder="${has ? esc(st.email) : 'la-tua@email.it'}" style="width:100%;padding:10px;border:1px solid var(--line,#ccc);border-radius:8px">
    <button style="margin-top:8px" onclick="bindEmail()">${has ? 'Aggiorna' : 'Collega'}</button>
    <span id="bindmsg" style="margin-left:8px"></span>
    ${st.mail_ready ? '' : '<p style="margin:8px 0 0;font-size:12px;color:#9a6a12">Invio email non ancora configurato lato server.</p>'}
  </div>`;
}
async function bindEmail() {
  const email = $('#bindmail').value.trim();
  if (!email) return;
  const r = await api('/bind-email', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email }) });
  $('#bindmsg').textContent = r.ok ? 'Collegata ✓' : (r.error || 'errore');
  if (r.ok) refresh();
}

function locked() {
  $('#ver').textContent = ''; $('#list').innerHTML = '';
  $('#add').style.display = 'none'; $('#gear').style.display = 'none';
  $('#setup').innerHTML = `<div class="card"><h2>Accesso richiesto</h2>
    <p style="margin-top:6px">Apri l'app aggiungendo la tua chiave all'indirizzo:<br>
    <code style="color:var(--calypso)">…workers.dev/?k=LA_TUA_CHIAVE</code></p>
    <p>Basta una volta per dispositivo: dopo resta salvata in un cookie.</p>
    <div style="border-top:1px solid var(--line,#e2e0d8);margin-top:12px;padding-top:12px">
      <b>Persa la chiave?</b>
      <p style="margin:4px 0 8px">Se hai collegato un'email, te la rimandiamo con un link.</p>
      <input id="recmail" type="email" placeholder="la-tua@email.it" style="width:100%;padding:10px;border:1px solid var(--line,#ccc);border-radius:8px">
      <button style="margin-top:8px" onclick="recover()">Rimandami il link</button>
      <span id="recmsg" style="margin-left:8px"></span>
    </div></div>`;
}
async function recover() {
  const email = $('#recmail').value.trim();
  if (!email) return;
  await api('/recover', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email }) });
  $('#recmsg').textContent = 'Se l\'email è collegata, controlla la posta.';
}

// One step. Vinted is never connected: the app reads public pages only.
const pushBlocked = () => !('Notification' in window) || Notification.permission === 'denied';
const waived = () => { try { return localStorage.getItem('waive_push') === '1'; } catch { return false; } };
window.waive = () => { try { localStorage.setItem('waive_push', '1'); } catch {} refresh(); };
const setupDone = (st) => st.push || waived();

function renderSetup(st) {
  const box = $('#setup');
  const broken = st.ai ? '' : `<div class="card"><h2>Servizio non configurato</h2>
    <p style="margin:6px 0 0">Manca la chiave del modello lato server. L'analisi delle foto non funzionerà finché non viene impostata.</p></div>`;
  const open = !setupDone(st) || showSetup;
  box.classList.toggle('gate', open);
  document.body.classList.toggle('gated', open);
  if (!open) { box.innerHTML = broken; return; }
  const done = setupDone(st);
  box.innerHTML = broken + `<div class="card onb">
    <div class="onb-h">${done ? anim('connect', 'check', 72) : anim('notifications', 'bell', 72)}
      <div><h2>${done ? 'Tutto pronto' : 'Benvenuto'}</h2>
      <p style="margin:0">${done ? 'Puoi modificare tutto da qui.' : 'Un solo passaggio, una volta sola.'}</p></div></div>
    <div class="step"><span class="tick">${done ? '✓' : '1'}</span>
      <div style="flex:1"><b>Attiva le notifiche</b>
        <p style="margin:4px 0 0">Ti avviso solo quando un capo è pronto da approvare o un ribasso è dovuto.</p>
        <p style="margin:6px 0 0;font-size:12.5px">L'app non si collega mai al tuo account Vinted: legge solo pagine pubbliche. Niente da bannare.</p>
        ${done ? '' : `<button style="margin-top:12px" onclick="enablePush()">Attiva</button>
          ${pushBlocked() ? `<button class="sec" style="margin:12px 0 0 8px" onclick="waive()">Continua senza</button>` : ''}`}
      </div></div>
    ${done ? `<button class="sec" style="width:100%;margin-top:14px" onclick="showSetup=false;refresh()">Chiudi</button>` : ''}
  </div>` + (showSetup ? emailCard(st) : '') + (st.user === 'owner' && showSetup ? accountsCard() : '');
  if (st.user === 'owner' && showSetup) loadAccounts();
}

// Accounts: the owner adds a person by name and gets a link to send them.
// Each person has their own drafts, notifications and drops; the extension
// follows whoever is logged into the app in that Chrome.
function accountsCard() {
  return `<div class="card onb" id="acct"><h2>Account</h2>
    <p style="margin:4px 0 12px">Ogni persona vede solo i propri capi. Mandale il link: lo apre una volta e ha finito.</p>
    <div id="acctlist" class="v">…</div>
    <div class="row" style="margin-top:12px"><input id="acctname" placeholder="nome (es. test, marco)" autocomplete="off">
      <button onclick="addAccount()">Aggiungi</button></div>
    <div id="acctnew"></div></div>`;
}
async function loadAccounts() {
  const r = await api('/users');
  const el = $('#acctlist'); if (!el) return;
  el.innerHTML = r.users ? r.users.map((u) => `<span class="badge ${u === 'owner' ? 'live' : ''}" style="margin:0 6px 6px 0">${esc(u)}</span>`).join('') : esc(r.error || '');
}
window.addAccount = async () => {
  const name = $('#acctname').value.trim(); if (!name) return;
  const r = await api('/users', { method: 'POST', body: JSON.stringify({ name }) });
  const out = $('#acctnew');
  if (r.error) { out.innerHTML = `<div class="warn">${esc(r.error)}</div>`; return; }
  $('#acctname').value = '';
  out.innerHTML = `<div class="hint" style="margin-top:10px"><b>${esc(r.name)}</b> — link di accesso (una volta sola, poi resta):<br>
    <code style="word-break:break-all;display:block;margin:6px 0">${esc(r.url)}</code>
    <button class="sec" onclick="copyText(${JSON.stringify(r.url)},this)">Copia link</button></div>`;
  loadAccounts();
}

function apkBanner(st) {
  const r = new URLSearchParams(location.search).get('v');
  if (!r || r === st.apk_version) return;
  $('#setup').insertAdjacentHTML('afterbegin', `<div class="card"><div class="row">
    <span style="flex:1">Nuova versione: ${st.apk_version}</span>
    <a href="/app.apk" download><button class="sec">Scarica</button></a></div></div>`);
}

window.enablePush = async () => {
  if (!('Notification' in window)) return alert('Notifiche non supportate su questo browser.');
  const reg = await navigator.serviceWorker.register('/sw.js');
  if ((await Notification.requestPermission()) !== 'granted') return refresh();
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true,
    applicationServerKey: Uint8Array.from(atob(CFG.vapid_public.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)) });
  await api('/push/subscribe', { method: 'POST', body: JSON.stringify(sub) });
  refresh();
};

function render(duringOnboarding) {
  // Already listed (live) or sold items are done here — they live in the
  // extension's "annunci attivi". The phone only shows what still needs you.
  const shown = items.filter((i) => !['live', 'sold'].includes(i.status));
  $('#list').innerHTML = shown.map(card).join('') || (duringOnboarding ? '' :
    `<div class="empty">${anim('empty', 'hanger', 120)}<b>Niente da vendere, per ora</b>Fotografa un capo — meglio se includi l'etichetta —<br>oppure condividi le foto dalla galleria a Quicksell.</div>`);
}
window.removeItem = async (id) => {
  if (!confirm('Rimuovere questo articolo? Le foto verranno cancellate.')) return;
  await act(id, 'reject');
};

const thumbs = (i) => `<div class="thumbs">${i.photos.map(k => `<img src="/api/photo/${encodeURIComponent(k)}" loading="lazy" alt="">`).join('')}</div>`;
const copyBar = (i) => `<div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px">
  <button class="sec" onclick="copyText(${JSON.stringify(i.title)},this)">Copia titolo</button>
  <button class="sec" onclick="copyText(${JSON.stringify(i.description)},this)">Copia descrizione</button>
  <button class="sec" onclick="copyText('${i.list_price}',this)">Copia prezzo</button></div>`;

function card(i) {
  const open = `<div class="card${i.due_price != null ? ' due' : ''}" data-s="${i.status}">`;
  const head = (x = '') => `<div class="row"><span class="badge ${i.status}">${LABEL[i.status]}</span>${x}<button class="rm" title="Rimuovi" aria-label="Rimuovi" onclick="removeItem(${i.id})">✕</button></div>`;

  if (i.status === 'analyzing' || i.status === 'queued')
    return `${open}${head('<span class="sp"></span>')}${thumbs(i)}</div>`;

  if (i.status === 'error')
    return `${open}${head(`<button class="sec" onclick="act(${i.id},'retry')">Riprova</button>`)}${thumbs(i)}<p class="note">${esc(i.note)}</p></div>`;

  if (i.status === 'ready')
    return `${open}${head()}${thumbs(i)}<h2>${esc(i.title)}</h2>
      <div class="prices"><div><b>${eur(i.list_price)}</b><span>pubblichi a</span></div>
        <div><b>${eur(i.est_price)}</b><span>stima</span></div><div><b>${eur(i.floor_price)}</b><span>minimo</span></div></div>
      <div class="hint"><b>Dal computer:</b> apri vinted.it → Vendi. L'estensione porta le foto e compila tutto; tu scegli i menu e pubblichi.</div>
      <details><summary>Oppure pubblica dall'app Vinted sul telefono</summary>
        <p style="margin:6px 0 0">Copia i testi, scegli le stesse foto in Vinted, pubblica. Poi condividi l'annuncio a Quicksell (o incolla il link qui) e da lì seguo il prezzo.</p>
        ${copyBar(i)}
        <div class="row" style="margin-top:10px"><input id="u${i.id}" placeholder="https://www.vinted.it/items/…" inputmode="url">
          <button class="sec" onclick="published(${i.id})">Collega</button></div></details>
      <div class="row" style="margin-top:12px"><button class="sec" onclick="act(${i.id},'reject')">Scarta</button></div></div>`;

  if (i.status === 'live' || i.status === 'sold') {
    const due = i.status === 'live' && i.due_price != null;
    return `${open}${head(`<span class="v" style="margin-left:auto">${i.views||0} visite · ${i.favourites||0} preferiti</span>`)}
      ${thumbs(i)}<h2>${esc(i.title)}</h2>
      <div class="prices"><div><b>${eur(i.current_price)}</b><span>ora</span></div>
        <div><b>${eur(i.list_price)}</b><span>iniziale</span></div><div><b>${eur(i.floor_price)}</b><span>minimo</span></div></div>
      ${due ? `<div class="warn"><b>Ribasso dovuto:</b> porta il prezzo a <b>${eur(i.due_price)}</b>.
          <div class="row" style="margin-top:8px"><a class="btn" href="${esc(i.vinted_url)}/edit" target="_blank" rel="noopener"><button class="warn">Apri su Vinted</button></a>
          <button class="sec" onclick="act(${i.id},'dropped')">Fatto</button></div></div>`
        : i.status === 'live' ? `<p style="margin-top:10px">−${CFG.drop_pct || 5}% ogni ${CFG.drop_days || 3} giorni, fino a ${eur(i.floor_price)}. Ti avviso io.</p>` : ''}
      ${i.vinted_url ? `<p style="margin-top:6px"><a href="${esc(i.vinted_url)}" target="_blank" rel="noopener" style="color:var(--calypso)">Vedi l'annuncio →</a></p>` : ''}</div>`;
  }

  // pending / needs_input — the approval card
  const nb = i.needs.includes('brand'), ns = i.needs.includes('size');
  return `${open}${head()}${thumbs(i)}
    <label>Titolo</label><input id="t${i.id}" value="${esc(i.title)}" maxlength="60">
    <label>Descrizione</label><textarea id="d${i.id}">${esc(i.description)}</textarea>
    <div class="row" style="gap:12px;align-items:flex-start">
      <div style="flex:1"><label>Marca${nb?' ⚠':''}</label><input id="b${i.id}" value="${esc(i.brand)}" placeholder="—"></div>
      <div style="flex:1"><label>Taglia${ns?' ⚠':''}</label><input id="s${i.id}" value="${esc(i.size)}" placeholder="—"></div>
    </div>
    ${nb?`<div class="warn">Non ho letto la marca su un'etichetta, l'ho dedotta dallo stile. Puoi <b>lasciare vuoto</b> il campo e pubblicare senza: è consentito e toglie ogni rischio.
      <button class="sec" style="margin-top:8px;padding:8px 12px;font-size:12px" onclick="document.getElementById('b${i.id}').value='';this.closest('.warn').remove()">Senza marca</button></div>`:''}
    ${ns&&!i.size?`<div class="warn">Taglia non trovata. Inseriscila: è il motivo n.1 di resi.</div>`:''}
    <div class="prices">
      <div><b>${eur(i.est_price)}</b><span>valore stimato</span></div>
      <div><b><input id="p${i.id}" value="${i.list_price}"></b><span>pubblichi a</span></div>
      <div><b><input id="f${i.id}" value="${i.floor_price}"></b><span>minimo</span></div>
    </div>
    ${i.comparables?`<div class="why">${esc(i.comparables.reasoning)}<br>
      <span class="v">Da ${i.comparables.sold} venduti e ${i.comparables.active} annunci attivi.</span></div>
      <details><summary>Vedi i comparabili</summary>${i.comparables.sample.map(c=>
        `<div class="v" style="padding:3px 0">${c.sold?'✔':'·'} ${esc(c.title)} — ${eur(c.price)}</div>`).join('')}</details>`:''}
    ${i.note?`<p class="hint" style="margin-top:8px">${esc(i.note)}</p>`:''}
    <div class="row" style="margin-top:16px">
      <button style="flex:1" onclick="approve(${i.id})">Approva</button>
      <button class="sec" onclick="act(${i.id},'reject')">Scarta</button>
    </div></div>`;
}

window.copyText = async (v, btn) => {
  try { await navigator.clipboard.writeText(v); } catch { prompt('Copia:', v); return; }
  const was = btn.textContent; btn.textContent = 'Copiato ✓'; setTimeout(() => { btn.textContent = was; }, 1400);
};
window.act = async (id, w) => { await api(`/items/${id}/${w}`, { method:'POST' }); refresh(); };
window.published = async (id) => {
  const r = await api(`/items/${id}/published`, { method:'POST', body: JSON.stringify({ url: $('#u' + id).value.trim() }) });
  if (r.error) return alert(r.error);
  refresh();
};
window.approve = async (id) => {
  const g = (p) => $('#' + p + id).value.trim();
  const b = event.target; b.disabled = true; b.textContent = 'Salvo…';
  const r = await api(`/items/${id}/approve`, { method:'POST', body: JSON.stringify({
    title:g('t'), description:g('d'), brand:g('b'), size:g('s'),
    list_price:Number(g('p')), floor_price:Number(g('f')), brand_confirmed:true }) });
  if (r.error) { alert(r.error); b.disabled = false; b.textContent = 'Approva'; return; }
  refresh();
};

// Uploads and analysis run in the background: queue the next capo immediately.
function fabLabel() { $('#add').textContent = uploading ? `Carico ${uploading}… aggiungine un altro` : 'Aggiungi le foto di un capo'; }
async function pump() {
  if (draining) return;
  draining = true;
  try { for (;;) { const r = await api('/drain', { method:'POST' }).catch(() => ({})); await refresh(); if (!r || !r.processed) break; } }
  finally { draining = false; }
}
$('#add').onclick = () => $('#file').click();
$('#file').onchange = (e) => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  const fd = new FormData(); for (const f of files) fd.append('photos', f);
  uploading++; fabLabel();
  fetch('/api/items', { method:'POST', body: fd }).then(() => { refresh(); pump(); }).finally(() => { uploading--; fabLabel(); });
};
$('#gear').onclick = () => { showSetup = true; refresh(); };

if (new URLSearchParams(location.search).get('shared')) {
  document.body.insertAdjacentHTML('beforeend', `<div class="toast">Foto ricevute: sto preparando l'annuncio.</div>`);
  history.replaceState(null, '', '/');
  setTimeout(() => document.querySelector('.toast')?.remove(), 4000);
  setTimeout(pump, 800);
}
navigator.serviceWorker?.register('/sw.js').catch(() => {});
refresh();
setInterval(() => {
  if (uploading || items.some((i) => ['analyzing', 'queued'].includes(i.status))) {
    refresh().then(() => { if (items.some((i) => i.status === 'queued')) pump(); });
  }
}, 6000);
</script>
</body>
</html>
